
version: 2

models:

  - name: dim_customers

    description: "One row per unique customer (deduped on customer_unique_id)"

    columns:

      - name: customer_unique_id

        tests: [not_null, unique]


  - name: fact_orders

    description: "One row per order, revenue and delivery metrics rolled up from order_items"

    meta:
      metrics:

        total_revenue:
          type: sum
          sql: ${total_order_value}

        total_orders:
          type: count_distinct
          sql: ${order_id}

        average_order_value:
          type: average
          sql: ${total_order_value}

        total_items:
          type: sum
          sql: ${item_count}

        total_product_sales:
          type: sum
          sql: ${total_price}

        total_freight:
          type: sum
          sql: ${total_freight_value}

    columns:

      - name: order_id

        tests: [not_null, unique]

      - name: customer_id

        tests:

          - relationships:

              arguments:

                to: ref('stg_customers')

                field: customer_id

      - name: item_count

        meta:
          dimension:
            type: number

      - name: total_price

        meta:
          dimension:
            type: number

      - name: total_freight_value

        meta:
          dimension:
            type: number

      - name: total_order_value

        meta:
          dimension:
            type: number

