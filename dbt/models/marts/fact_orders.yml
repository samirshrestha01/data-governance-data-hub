version: 2

models:

  - name: fact_orders

    description: "One row per order, with revenue and delivery metrics."

    meta:

      joins:
        - join: dim_customers
          sql_on: ${fact_orders.customer_id} = ${dim_customers.customer_id}
          type: left
          relationship: many-to-one

      metrics:

        total_revenue:
          type: sum
          sql: ${total_order_value}

        total_orders:
          type: count_distinct
          sql: ${order_id}

        average_order_value:
          type: average
          sql: ${total_order_value}

        total_items:
          type: sum
          sql: ${item_count}

        total_product_sales:
          type: sum
          sql: ${total_price}

        total_freight:
          type: sum
          sql: ${total_freight_value}

    columns:

      - name: order_id
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: order_status

      - name: order_purchase_at

      - name: order_approved_at

      - name: order_delivered_carrier_at

      - name: order_delivered_customer_at

      - name: order_estimated_delivery_at

      - name: item_count
        meta:
          dimension:
            type: number

      - name: total_price
        meta:
          dimension:
            type: number

      - name: total_freight_value
        meta:
          dimension:
            type: number

      - name: total_order_value
        meta:
          dimension:
            type: number