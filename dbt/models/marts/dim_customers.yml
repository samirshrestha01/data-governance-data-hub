version: 2

models:

  - name: dim_customers

    description: "One row per customer record"

    columns:

      - name: customer_id
        tests:
          - not_null
          - unique

      - name: customer_unique_id
        tests:
          - not_null

      - name: customer_zip_code_prefix

      - name: customer_city

      - name: customer_state