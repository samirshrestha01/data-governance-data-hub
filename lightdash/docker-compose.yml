services:
  lightdash-db:
    image: pgvector/pgvector:pg15
    container_name: lightdash-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - lightdash_db_data:/var/lib/postgresql/data

  minio:
    image: coollabsio/minio:latest
    container_name: lightdash-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: default
      MINIO_EXPIRATION_DAYS: 1
    command: server /data --console-address ":9001"
    volumes:
      - lightdash_minio_data:/data

  headless-browser:
    image: ghcr.io/browserless/chromium:v2.24.3
    container_name: lightdash-browser
    restart: unless-stopped
    environment:
      PORT: 3000

  lightdash:
    image: lightdash/lightdash:latest
    platform: linux/amd64
    container_name: lightdash
    restart: unless-stopped

    depends_on:
      - lightdash-db
      - minio
      - headless-browser

    environment:
      # Lightdash's own metadata database
      PGHOST: lightdash-db
      PGPORT: 5432
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}

      LIGHTDASH_SECRET: ${LIGHTDASH_SECRET}

      PORT: 8080
      SITE_URL: http://localhost:8080
      SECURE_COOKIES: "false"
      TRUST_PROXY: "false"

      HEADLESS_BROWSER_HOST: headless-browser
      HEADLESS_BROWSER_PORT: 3000

      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: default
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      
      DBT_PROJECT_DIR: /usr/app/dbt

    volumes:
      - ../dbt:/usr/app/dbt
    ports:
      - "8080:8080"

volumes:
  lightdash_db_data:
  lightdash_minio_data: